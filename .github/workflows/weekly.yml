name: radar-weekly
on:
  schedule:
    # UTC 周日 16:00 = 北京时间周一 00:00（同样为避开 schedule 4~5 小时延迟，见 daily.yml 注释）
    - cron: "0 16 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pymysql
        run: pip install --quiet pymysql
      - name: fetch & build
        run: node radar.mjs --mode weekly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: save to aliyun mysql
        continue-on-error: true
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
        run: python scripts/load_db.py --mode weekly
      - name: commit
        run: |
          git config user.name "github-radar"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "weekly update $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout origin/main -- index.html domains.html cards.html 2>/dev/null || true
              git add index.html domains.html cards.html 2>/dev/null || true
              git -c core.editor=true rebase --continue || git rebase --abort
            fi
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            sleep 8
          done
          echo "push failed after 5 attempts"; exit 1

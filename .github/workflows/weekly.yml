name: radar-weekly
on:
  schedule:
    # UTC 周日 16:00 = 北京时间周一 00:00（同样为避开 schedule 4~5 小时延迟，见 daily.yml 注释）
    - cron: "0 16 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch & build
        run: node radar.mjs --mode weekly
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: compute star deltas & re-render
        # 周报用 7 天窗口算涨星；先重排再落库，保证重排后新进榜的项目也入库
        continue-on-error: true
        env:
          RADAR_DB: data/backup/github_radar.sqlite
        run: |
          python scripts/delta_rank.py --mode weekly --days 7
          node radar.mjs --mode weekly --render-only
      - name: save to local sqlite
        continue-on-error: true
        env:
          RADAR_DB: data/backup/github_radar.sqlite
        run: python scripts/load_db.py --mode weekly
      - name: commit
        run: |
          git config user.name "github-radar"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "weekly update $(date -u +%F)"
          # SQLite 二进制冲突时统一用远程版本覆盖后继续（落库幂等，下一轮自动补齐）
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout origin/main -- index.html domains.html cards.html data/backup/github_radar.sqlite 2>/dev/null || true
              git add index.html domains.html cards.html data/backup/github_radar.sqlite 2>/dev/null || true
              git -c core.editor=true rebase --continue || git rebase --abort
            fi
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            sleep 8
          done
          echo "push failed after 5 attempts"; exit 1

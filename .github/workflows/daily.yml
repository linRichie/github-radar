name: radar-daily
on:
  schedule:
    # UTC 16:00 = 北京时间次日 00:00。
    # 实测 GitHub 免费 runner 的 schedule 会延迟 4~5 小时（配 08:00 时实际 12:1x~12:4x 才跑），
    # 因此把触发点提前到凌晨，延迟后落在 02:00~05:00 完成；09:00 的 WorkBuddy 兜底检查时会
    # 发现数据已是当天、不再重复触发，从而消除"一天跑两次"。
    - cron: "0 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install pymysql
        run: pip install --quiet pymysql
      - name: fetch & build
        run: node radar.mjs --mode daily
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: compute star deltas & re-render
        # 顺序关键：delta 只用「今天之前」的历史快照，所以可以放在落库之前；
        # 先重排再落库，才能保证最终榜单上的项目（含重排后新进榜的）全部入库
        continue-on-error: true
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
        run: |
          python scripts/delta_rank.py --mode daily --days 3
          node radar.mjs --mode daily --render-only
      - name: save to aliyun mysql
        # 落库失败不阻断页面发布；凭据全部来自仓库 Secrets，不入代码
        continue-on-error: true
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
        run: python scripts/load_db.py --mode daily
      - name: export history for site
        # 导出站点用的历史视图：回放分片（永久）+ 趋势文件（90 天窗口）+ 日期索引
        # 只读 DB、不删除任何数据（数据库仍全量保留）
        continue-on-error: true
        env:
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DB: ${{ secrets.MYSQL_DB }}
        run: python scripts/export_history.py --days 90
      - name: commit
        run: |
          git config user.name "github-radar"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          # 远程可能在此期间被人工提交推进（会报 cannot lock ref / non-fast-forward），
          # 先 rebase 再重试；生成物冲突时用远程版本覆盖后继续
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout origin/main -- index.html domains.html cards.html 2>/dev/null || true
              git add index.html domains.html cards.html 2>/dev/null || true
              git -c core.editor=true rebase --continue || git rebase --abort
            fi
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            sleep 8
          done
          echo "push failed after 5 attempts"; exit 1
